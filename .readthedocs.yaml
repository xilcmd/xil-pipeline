# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      - python docs/build_docs.py

# Build documentation with Mkdocs. strict: true already lives in mkdocs.yml
# (applies to every invocation); fail_on_warning is RTD's own belt-and-braces
# gate — there is no "strict" key in this schema, only fail_on_warning.
mkdocs:
   configuration: mkdocs.yml
   fail_on_warning: true

# Install the package with docs dependencies so MkDocs plugins are available
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
