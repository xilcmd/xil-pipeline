[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xil-pipeline"
version = "0.3.1"
description = "Show-agnostic audio production pipeline: markdown script to podcast-ready MP3 via ElevenLabs"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "John Brissette", email = "xilcmd@gmail.com" }]
keywords = ["podcast", "audio", "tts", "elevenlabs", "production-pipeline", "text-to-speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "elevenlabs>=2.38,<3",
    "pydub>=0.25,<1",
    "pydantic>=2.0,<3",
    "mutagen>=1.47",
    "httpx>=0.27",
    "audioop-lts>=0.2.1; python_version>='3.13'",
]

[project.urls]
Documentation = "https://xil-pipeline.readthedocs.io/en/latest/"
Repository = "https://github.com/xilcmd/xil-pipeline"
Issues = "https://github.com/xilcmd/xil-pipeline/issues"

[project.optional-dependencies]
google = ["google-genai>=1.60,<2"]
tts-alt = ["gTTS>=2.5,<3", "pyttsx3>=2.99,<3"]
ollama = ["ollama>=0.6,<1"]
gui = ["gradio>=4.0,<6"]
publish = ["anthropic>=0.40"]
all = ["xil-pipeline[google,tts-alt,ollama,publish]"]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15",
    "argparse-manpage>=4.6,<5",
    "gradio>=4.0,<6",
    "gradio_client>=1.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin>=2.10",
    "mkdocstrings[python]>=0.27",
    "mkdocs-autorefs>=1.4",
    "pymdown-extensions>=10.21.3",
]

[project.scripts]
xil            = "xil_pipeline.xil:main"
xil-scan       = "xil_pipeline.XILP000_script_scanner:main"
xil-parse      = "xil_pipeline.XILP001_script_parser:main"
xil-produce    = "xil_pipeline.XILP002_producer:main"
xil-assemble   = "xil_pipeline.XILP003_audio_assembly:main"
xil-daw        = "xil_pipeline.XILP005_daw_export:main"
xil-cues       = "xil_pipeline.XILP006_cues_ingester:main"
xil-migrate    = "xil_pipeline.XILP007_stem_migrator:main"
xil-cleanup    = "xil_pipeline.XILP008_stale_stem_cleanup:main"
xil-studio-onboard = "xil_pipeline.XILP004_studio_onboard:main"
xil-regen      = "xil_pipeline.XILP009_script_regenerator:main"
xil-import     = "xil_pipeline.XILP010_studio_import:main"
xil-master     = "xil_pipeline.XILP011_master_export:main"
xil-publish    = "xil_pipeline.XILP012_publish:main"
xil-voices     = "xil_pipeline.XILU001_discover_voices_T2S:main"
xil-sfx        = "xil_pipeline.XILU002_generate_SFX:main"
xil-csv-join   = "xil_pipeline.XILU003_csv_sfx_join:main"
xil-sample     = "xil_pipeline.XILU004_sample_voices_T2S:main"
xil-sfx-lib    = "xil_pipeline.XILU005_discover_SFX:main"
xil-splice     = "xil_pipeline.XILU006_splice_parsed:main"
xil-mp3-hash   = "xil_pipeline.XILU007_mp3_hash:main"
xil-stem-log          = "xil_pipeline.XILU008_stem_log_report:main"
xil-migrate-workspace = "xil_pipeline.XILU009_migrate_workspace:main"
xil-db-profile        = "xil_pipeline.XILU010_db_profile:main"
xil-sfx-csv           = "xil_pipeline.XILU011_sfx_csv:main"
xil-parsed-csv        = "xil_pipeline.XILU012_parsed_csv:main"
xil-sfx-hydrate       = "xil_pipeline.XILU013_sfx_hydrate:main"
xil-sfx-restore       = "xil_pipeline.XILU020_sfx_restore:main"
xil-episode-summary   = "xil_pipeline.XILU014_episode_summary:main"
xil-stem-verify       = "xil_pipeline.XILU015_stem_verify:main"
xil-stem-compare      = "xil_pipeline.XILU016_stem_compare:main"
xil-remove-show       = "xil_pipeline.XILU017_remove_show:main"
xil-remove-episode    = "xil_pipeline.XILU018_remove_episode:main"
xil-status            = "xil_pipeline.XILU019_episode_status:main"
xil-init              = "xil_pipeline.xil_init:main"
xil-gui               = "xil_pipeline.xil_gui:main"
xil-use               = "xil_pipeline.xil_use:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xil_pipeline"]

[tool.hatch.build.targets.wheel.shared-data]
"man/man1" = "share/man/man1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_level = "INFO"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",   # line-too-long (relaxed to 120 via line-length above)
    "E741",   # ambiguous variable name (single-char vars fine in context)
]

[tool.ruff.lint.isort]
known-first-party = ["xil_pipeline"]
