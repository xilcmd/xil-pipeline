name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Only "test (ubuntu-latest, 3.13)" blocks a merge; the rest are
      # informational.  With the default fail-fast, one of those informational
      # jobs failing CANCELS the required one — which then reports "fail"
      # without ever having run ("The strategy configuration was canceled
      # because test.macos-latest_3_13 failed").  A flaky network-dependent
      # test on macOS must not be able to block a merge that way.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg_extract
          $bin = (Get-ChildItem C:\ffmpeg_extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
          echo $bin >> $env:GITHUB_PATH
      - name: Install package with dev dependencies
        run: pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src/xil_pipeline/
      - name: Man page drift check
        if: runner.os == 'Linux'
        run: python docs/build_man.py --check
      - name: Docs strict build
        if: runner.os == 'Linux'
        # Built from a copy named "latest", matching how Read the Docs checks
        # out. The runner's own workspace is .../xil-pipeline/xil-pipeline, and
        # build_docs.py used to derive its output directory from that name — so
        # this job passed while RTD failed on ~86 duplicate-anchor warnings.
        # Keep the rename: it is the only thing here that exercises that path.
        run: |
          pip install -e ".[docs]"
          cp -a "$GITHUB_WORKSPACE" /tmp/latest
          cd /tmp/latest
          python docs/build_docs.py
          python -m mkdocs build --strict
      - name: Run tests
        run: pytest tests/ -v --tb=short
